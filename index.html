<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Halloween Sketchpad</title>
  </head>
  <body style="background-color:darkgray">
    <h1>Halloween Sketchpad</h1>
    <div>
      <button id="zombie">🧟‍♂️</button>
      <button id="pumpkin">🎃</button>
      <button id="skull">💀</button>
      <button id="ghost">👻</button>
      <button id="grave">🪦</button>
    </div>
    <main id="app">
      <canvas id="canvas"></canvas>
      <style>
      canvas {
        border: thick solid black;
      }
      </style>
      <br></br>
      <button id="thin">Thiner</button>
      <button id="thick">Thicker</button>
      <button id="clear">clear</button>
      <button id="undo">undo</button>
      <button id="redo">redo</button>
      <button id="export">export</button>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
